<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB English Literature Oral Visual Timer</title>
    <script type="text/javascript">
      // GitHub Pages SPA & Subpath Recovery Handler
      (function() {
        var l = window.location;
        var parts = l.pathname.split('/').filter(Boolean);
        // On user.github.io/repo/, parts[0] is the repository name
        var repoName = parts.length > 0 ? parts[0] : '';
        var isUnderDocs = l.pathname.indexOf('/docs') !== -1;
        
        var targetPath = '/';
        if (repoName && l.hostname.endsWith('github.io')) {
          targetPath = '/' + repoName + '/';
          if (isUnderDocs) {
            targetPath += 'docs/';
          }
        }
        
        l.replace(l.protocol + '//' + l.host + targetPath + l.search + l.hash);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; background: #0f172a; color: #f8fafc;">
    <h2>Loading IB Literature Oral Timer...</h2>
    <p>Redirecting to <a href="./" style="color: #f59e0b;">timer homepage</a>...</p>
  </body>
</html>
