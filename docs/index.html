    <script>
      // Marker for raw root vs compiled static bundle
      window.__IS_RAW_ROOT__ = false;

      // GitHub Pages Support & Trailing Slash Correction
      (function() {
        try {
          var loc = window.location;
          var isGitHubPages = loc.hostname.endsWith('github.io');
          
          // 1. Ensure trailing slash on GitHub Pages so relative asset paths (./assets/...) resolve properly
          if (isGitHubPages && !loc.pathname.endsWith('/') && !loc.pathname.split('/').pop().includes('.')) {
            loc.replace(loc.protocol + '//' + loc.host + loc.pathname + '/' + loc.search + loc.hash);
            return;
          }

          // 2. Unbundled Root Fallback: If GitHub Pages is configured to serve from the repository root (not /docs/),
          // redirect to the compiled /docs/ static bundle so it executes in all browsers without extensions.
          if (isGitHubPages && window.__IS_RAW_ROOT__ && !loc.pathname.includes('/docs/')) {
            var basePath = loc.pathname.endsWith('/') ? loc.pathname : loc.pathname + '/';
            loc.replace(loc.protocol + '//' + loc.host + basePath + 'docs/' + loc.search + loc.hash);
            return;
          }
        } catch (e) {
          console.warn('Navigation check failed:', e);
        }
      })();
    </script>
    <script>
      try {
        const theme = localStorage.getItem('ib_oral_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    </script>
